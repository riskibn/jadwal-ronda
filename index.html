<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=800">
    <title>E-Ronda Smart System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #030712;
            --bg-capture: linear-gradient(135deg, #070C1A 0%, #0c1328 100%);
            --bg-box: rgba(17, 24, 39, 0.6);
            --border-box: rgba(255, 255, 255, 0.03);
            --text-main: #ffffff;
            --text-sub: #9ca3af;
            --border-default: #374151;
            --shadow-capture: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(16, 185, 129, 0.03);
            --divider-grad: linear-gradient(90deg, rgba(16, 185, 129, 0) 0%, rgba(16, 185, 129, 0.8) 50%, rgba(16, 185, 129, 0) 100%);
            --control-border: rgba(255, 255, 255, 0.1);
            --control-btn-bg: rgba(255, 255, 255, 0.05);
            --control-btn-hover: rgba(255, 255, 255, 0.1);
            --control-text: #d1d5db;
            --blue-text: #60a5fa;
            --accent-color: #34d399; /* Emerald 400 untuk Dark Mode */

            /* Variabel Khusus Hari Jumat (Ronda Bersama) */
            --bg-jumat: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            --border-jumat: #60a5fa;
            --text-jumat-num: #ffffff;
            --text-jumat-label: #dbeafe;
            --shadow-jumat: 0 8px 20px -6px rgba(37, 99, 235, 0.4);
        }

        .light-theme {
            --bg-body: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%); /* Latar belakang gradasi lembut */
            --bg-capture: #ffffff; /* Latar belakang kartu putih bersih */
            --bg-box: #f8fafc; /* Kotak kalender abu-abu super lembut */
            --border-box: rgba(15, 23, 42, 0.06);
            --text-main: #0f172a; /* Teks utama abu-batu gelap premium */
            --text-sub: #64748b; /* Teks sekunder abu-abu teduh */
            --border-default: #e2e8f0; /* Garis pembatas tipis */
            --shadow-capture: 0 20px 40px -15px rgba(15, 23, 42, 0.06), 0 0 30px rgba(16, 185, 129, 0.01);
            --divider-grad: linear-gradient(90deg, rgba(5, 150, 105, 0) 0%, rgba(5, 150, 105, 0.5) 50%, rgba(5, 150, 105, 0) 100%);
            --control-border: #e2e8f0;
            --control-btn-bg: #f8fafc;
            --control-btn-hover: #f1f5f9;
            --control-text: #475569;
            --blue-text: #1d4ed8;
            --accent-color: #059669; /* Emerald 600 untuk kontras maksimal di Light Mode */

            /* Desain Ulang Hari Jumat versi Pastel Lembut (Sangat Nyaman di Mata) */
            --bg-jumat: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            --border-jumat: #3b82f6;
            --text-jumat-num: #1d4ed8;
            --text-jumat-label: #1e40af;
            --shadow-jumat: 0 4px 12px -3px rgba(59, 130, 246, 0.15);
        }

        body { 
            background: var(--bg-body); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            min-width: 800px; 
            margin: 0;
            padding: 40px 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #captureArea { 
            width: 800px; 
            background: var(--bg-capture); 
            padding: 45px; 
            border-radius: 24px;
            box-shadow: var(--shadow-capture);
            border: 1px solid var(--border-box);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .grid-calendar { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            gap: 12px; 
        }
        .day-box { 
            height: 110px; 
            background: var(--bg-box); 
            backdrop-filter: blur(8px);
            border-radius: 16px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            border-left: 6px solid var(--border-default); 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-top: 1px solid var(--border-box);
            border-right: 1px solid var(--border-box);
            color: var(--text-main);
            position: relative;
        }
        .day-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(0, 0, 0, 0.15);
        }
        
        /* Modern Highlight Tanggal Aktif (Hari Ini) */
        .day-box-active-today {
            cursor: pointer;
            transform: scale(1.03) translateY(-2px);
            box-shadow: 0 12px 24px -10px rgba(16, 185, 129, 0.15);
            animation: pulse-border 2s infinite alternate;
        }
        .day-box-active-today::before {
            content: "Hari Ini";
            position: absolute;
            top: 8px;
            right: 12px;
            font-size: 8px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #10b981;
        }
        .pulse-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #10b981;
            position: absolute;
            top: 11px;
            right: 56px;
            box-shadow: 0 0 8px #10b981;
            animation: pulse-dot-anim 1.5s infinite;
        }
        @keyframes pulse-dot-anim {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }

        .regu-jumat { 
            background: var(--bg-jumat) !important; 
            border-left: 6px solid var(--border-jumat) !important; 
            box-shadow: var(--shadow-jumat);
        }
        .regu-jumat b {
            color: var(--text-jumat-num) !important;
        }
        .regu-jumat span {
            color: var(--text-jumat-label) !important;
        }
        .info-card { 
            background: var(--bg-box); 
            backdrop-filter: blur(8px);
            border-radius: 16px; 
            padding: 18px; 
            border-top: 5px solid transparent; 
            border-left: 1px solid var(--border-box);
            border-right: 1px solid var(--border-box);
            border-bottom: 1px solid var(--border-box);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .divider-line { 
            height: 2px; 
            background: var(--divider-grad); 
            margin: 25px 0; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .main-title {
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.05);
            transition: text-shadow 0.4s ease;
        }
        .light-theme .main-title {
            text-shadow: none;
        }
        .control-btn {
            background: var(--control-btn-bg);
            border: 1px solid var(--control-border);
            color: var(--control-text);
            transition: all 0.3s ease;
        }
        .control-btn:hover {
            background: var(--control-btn-hover);
        }
        .text-main-val {
            color: var(--text-main) !important;
            transition: color 0.4s ease;
        }
        .text-sub-val {
            color: var(--text-sub) !important;
            transition: color 0.4s ease;
        }
        .info-card-blue-text {
            color: var(--blue-text) !important;
            transition: color 0.4s ease;
        }
    </style>
</head>
<body class="text-white">

    <div id="captureArea">
        <div class="text-center mb-6">
            <h1 class="text-4xl font-extrabold tracking-wider text-main-val main-title">JADWAL RONDA FLAMBOYAN</h1>
            <p id="subTitle" class="text-[11px] mt-3 font-extrabold tracking-[0.25em] uppercase transition-colors duration-300" style="color: var(--accent-color)">BLOK FLAMBOYAN RT 05 RW 09 - PERUM KOTA GALUH, CIAMIS</p>
        </div>

        <!-- Garis Pemisah Estetis -->
        <div class="divider-line"></div>

        <!-- Layout Header Bulan dan Tombol Aksi -->
        <div class="flex justify-between items-center mb-8">
            <h2 id="monthTitle" class="text-2xl font-bold tracking-tight text-main-val"></h2>
            
            <div class="flex gap-3 items-center" id="controls">
                <button onclick="changeMonth(-1)" class="w-10 h-10 control-btn rounded-full flex items-center justify-center active:scale-95"><i class="fa fa-chevron-left text-sm"></i></button>
                <button onclick="changeMonth(1)" class="w-10 h-10 control-btn rounded-full flex items-center justify-center active:scale-95"><i class="fa fa-chevron-right text-sm"></i></button>
                
                <!-- Tombol Ganti Tema (Moon/Sun) -->
                <button id="themeToggleBtn" onclick="toggleTheme()" class="w-10 h-10 control-btn rounded-full flex items-center justify-center active:scale-95" title="Ubah Tema">
                    <i id="themeIcon" class="fa fa-sun text-sm text-yellow-400"></i>
                </button>

                <button onclick="downloadImage()" class="px-6 py-2 bg-gradient-to-r from-emerald-600 to-emerald-500 rounded-full font-bold text-xs tracking-wider uppercase hover:from-emerald-500 hover:to-emerald-400 active:scale-95 transition-all shadow-lg shadow-emerald-950/40 flex items-center">
                    <i class="fa fa-download mr-2"></i>UNDUH JPEG
                </button>
            </div>
        </div>

        <!-- Kolom Nama Hari -->
        <div class="grid-calendar text-center text-[10px] font-extrabold text-sub-val mb-5 uppercase tracking-widest">
            <div>Minggu</div><div>Senin</div><div>Selasa</div><div>Rabu</div><div>Kamis</div><div>Jumat</div><div>Sabtu</div>
        </div>
        
        <div id="calendarGrid" class="grid-calendar mb-10"></div>

        <div class="flex items-center gap-3 mb-5">
            <div class="w-2.5 h-6 bg-gradient-to-b from-emerald-400 to-emerald-600 rounded-full"></div>
            <h3 class="text-lg font-bold tracking-tight text-main-val">PAPAN INFORMASI REGU</h3>
        </div>
        
        <div id="infoBoard" class="grid grid-cols-5 gap-3"></div>
    </div>

    <!-- Popup Modal Informasi Petugas Hari Ini (Luar captureArea agar tidak terunduh) -->
    <div id="patrolModal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-50 hidden opacity-0 transition-all duration-300">
        <div class="w-[450px] bg-slate-900/90 border border-slate-700/50 rounded-3xl p-6 shadow-2xl relative transform scale-95 transition-all duration-300">
            <!-- Close Button -->
            <button onclick="closePatrolModal()" class="absolute top-4 right-4 w-8 h-8 bg-white/5 rounded-full flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/10 transition">
                <i class="fa fa-times"></i>
            </button>
            
            <!-- Modal Header -->
            <div class="flex items-center gap-3.5 mb-5 border-b border-slate-700/40 pb-4">
                <div id="modalThemeBadge" class="w-12 h-12 rounded-full flex items-center justify-center text-white text-xl shadow-lg">
                    <i class="fa fa-shield-halved"></i>
                </div>
                <div>
                    <h3 class="text-lg font-extrabold text-white tracking-tight" id="modalReguTitle">Regu Bertugas</h3>
                    <p class="text-xs text-slate-400 mt-0.5" id="modalPatrolDate"></p>
                </div>
            </div>

            <!-- Modal Content -->
            <div class="space-y-4">
                <div class="bg-slate-950/40 border border-slate-800/80 rounded-2xl p-4">
                    <p class="text-[10px] text-slate-400 font-extrabold tracking-wider uppercase mb-3">Daftar Anggota Petugas Piket Malam</p>
                    <div id="modalMemberList" class="space-y-2.5">
                        <!-- Names appended here -->
                    </div>
                </div>
            </div>

            <div class="mt-6 flex justify-end">
                <button onclick="closePatrolModal()" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold text-xs uppercase tracking-wider transition">Tutup Detail</button>
            </div>
        </div>
    </div>

    <script>
        let date = new Date();
        const epochDate = new Date(2026, 0, 1);
        const reguData = {
            1: { name: 'Regu 1', members: ['DIKA', 'RIDWAN', 'BUNYAMIN', 'YAM', 'HELMI'], color: '#f97316' },
            2: { name: 'Regu 2', members: ['DEDE', 'CECEP', 'WAHYU', 'REDI', 'BANGBANG'], color: '#22c55e' },
            3: { name: 'Regu 3', members: ['DANI', 'YUDAN', 'HERI', 'RAMADHAN', 'RISKI'], color: '#eab308' },
            4: { name: 'Regu 4', members: ['ZAINU', 'MOELYADI', 'GILANG', 'DADAN', 'TAUFIQ'], color: '#a855f7' }
        };

        // Mengembalikan nomor regu bertugas untuk hari tertentu (mengabaikan Jumat)
        function getRegu(d) {
            let c = 0; 
            let t = new Date(epochDate);
            while(t < new Date(date.getFullYear(), date.getMonth(), d)) { 
                if(t.getDay() !== 5) c++; 
                t.setDate(t.getDate()+1); 
            }
            return (c % 4) + 1;
        }

        function toggleTheme() {
            const body = document.body;
            const captureArea = document.getElementById('captureArea');
            const icon = document.getElementById('themeIcon');
            
            if (body.classList.contains('light-theme')) {
                body.classList.remove('light-theme');
                captureArea.classList.remove('light-theme');
                icon.className = 'fa fa-sun text-sm text-yellow-400';
                localStorage.setItem('theme', 'dark');
            } else {
                body.classList.add('light-theme');
                captureArea.classList.add('light-theme');
                icon.className = 'fa fa-moon text-sm text-indigo-600';
                localStorage.setItem('theme', 'light');
            }
        }

        // Memulihkan tema tersimpan jika ada
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-theme');
            document.getElementById('captureArea').classList.add('light-theme');
            document.getElementById('themeIcon').className = 'fa fa-moon text-sm text-indigo-600';
        }

        function render(excludeHighlight = false) {
            const grid = document.getElementById('calendarGrid'); 
            grid.innerHTML = '';
            document.getElementById('monthTitle').innerText = date.toLocaleString('id-ID', {month:'long', year:'numeric'}).toUpperCase();
            
            const days = new Date(date.getFullYear(), date.getMonth()+1, 0).getDate();
            const first = new Date(date.getFullYear(), date.getMonth(), 1).getDay();
            
            // Dapatkan waktu riil hari ini untuk validasi highlight
            const realToday = new Date();
            const currentYear = date.getFullYear();
            const currentMonth = date.getMonth();

            // Render kotak kosong untuk offset hari pertama awal bulan
            for(let i=0; i<first; i++) grid.innerHTML += '<div></div>';
            
            // Perulangan hari dalam sebulan
            for(let d=1; d<=days; d++) {
                const cur = new Date(currentYear, currentMonth, d);
                
                // Cek apakah tanggal hari ini sedang aktif (sama dengan tanggal riil) dan tidak sedang dalam mode unduh
                const isTodayActive = !excludeHighlight && 
                                     realToday.getDate() === d && 
                                     realToday.getMonth() === currentMonth && 
                                     realToday.getFullYear() === currentYear;

                if(cur.getDay() === 5) {
                    if (isTodayActive) {
                        // Highlight Hari Jumat Aktif (Ronda Bersama) di Web - Menggunakan Soft Glow & Pulse
                        grid.innerHTML += `
                            <div onclick="openPatrolModal('jumat', ${d})" class="day-box regu-jumat day-box-active-today">
                                <span class="pulse-dot"></span>
                                <b class="text-3xl font-extrabold tracking-tight text-white">${d}</b>
                                <span class="text-[9px] font-extrabold uppercase mt-2 tracking-wider leading-tight text-blue-100">Ronda Bersama</span>
                            </div>`;
                    } else {
                        // Hari Jumat Biasa
                        grid.innerHTML += `
                            <div class="day-box regu-jumat flex flex-col justify-center items-center text-center">
                                <b class="text-3xl font-extrabold tracking-tight">${d}</b>
                                <span class="text-[9px] font-extrabold uppercase mt-2 tracking-wider leading-tight">Ronda Bersama</span>
                            </div>`;
                    }
                } else {
                    const reguIndex = getRegu(d);
                    const r = reguData[reguIndex];
                    if (isTodayActive) {
                        // Highlight Hari Regu Aktif di Web - Desain Soft Glow Border, Pulse Dot & Tag Hari Ini (Lebih Premium & Clickable)
                        grid.innerHTML += `
                            <div onclick="openPatrolModal(${reguIndex}, ${d})" class="day-box day-box-active-today" 
                                 style="border-color:${r.color}; border-width: 2px; border-left-width: 6px; background: rgba(255,255,255,0.06);">
                                <span class="pulse-dot"></span>
                                <b class="text-3xl font-extrabold tracking-tight text-main-val">${d}</b>
                                <span class="text-[9px] font-bold opacity-90 uppercase mt-2 tracking-wider leading-tight text-emerald-400">${r.name}</span>
                            </div>`;
                    } else {
                        // Hari Regu Biasa (Hanya Strip Samping)
                        grid.innerHTML += `
                            <div class="day-box flex flex-col justify-center items-center text-center" style="border-left-color:${r.color}">
                                <b class="text-3xl font-extrabold tracking-tight text-main-val">${d}</b>
                                <span class="text-[9px] font-bold opacity-70 uppercase mt-2 tracking-wider text-sub-val leading-tight">${r.name}</span>
                            </div>`;
                    }
                }
            }
            
            // Render Papan Informasi Anggota
            const info = document.getElementById('infoBoard'); 
            info.innerHTML = '';
            for(let i=1; i<=4; i++) {
                info.innerHTML += `
                    <div class="info-card" style="border-top-color:${reguData[i].color}">
                        <div class="font-extrabold text-xs mb-3 text-main-val uppercase tracking-wider">${reguData[i].name}</div>
                        <div class="text-[10px] text-sub-val font-medium leading-relaxed">${reguData[i].members.join('<br>')}</div>
                    </div>`;
            }
            info.innerHTML += `
                <div class="info-card border-t-[5px] border-blue-500">
                    <div class="font-extrabold text-xs mb-3 text-main-val uppercase tracking-wider">Semua</div>
                    <div class="text-[10px] info-card-blue-text font-bold leading-relaxed">Jumat<br><span class="text-[9px] opacity-80 font-normal">Ronda Bersama</span></div>
                </div>`;
        }

        // Kontrol Popup Modal
        window.openPatrolModal = function(regu, dayNum) {
            const modal = document.getElementById('patrolModal');
            const title = document.getElementById('modalReguTitle');
            const badge = document.getElementById('modalThemeBadge');
            const dateStr = document.getElementById('modalPatrolDate');
            const list = document.getElementById('modalMemberList');

            // Format tanggal pop up
            const tempDate = new Date();
            const formattedDate = tempDate.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            dateStr.innerText = formattedDate;

            list.innerHTML = '';

            if (regu === 'jumat') {
                title.innerText = "Ronda Bersama (Semua Warga)";
                badge.style.backgroundColor = '#2563eb';
                badge.style.boxShadow = '0 0 15px rgba(37, 99, 235, 0.4)';
                
                // Tampilkan semua warga bergabung
                const allMembers = [];
                Object.values(reguData).forEach(r => allMembers.push(...r.members));
                const uniqueMembers = [...new Set(allMembers)];

                uniqueMembers.forEach(name => {
                    list.innerHTML += `
                        <div class="flex items-center gap-3 bg-slate-900/60 p-2.5 rounded-xl border border-slate-800/50">
                            <div class="w-2.5 h-2.5 rounded-full bg-blue-500"></div>
                            <span class="text-sm font-semibold text-slate-200 tracking-wide">${name}</span>
                        </div>`;
                });
            } else {
                const r = reguData[regu];
                title.innerText = `Petugas Piket ${r.name}`;
                badge.style.backgroundColor = r.color;
                badge.style.boxShadow = `0 0 15px ${r.color}60`;

                r.members.forEach(name => {
                    list.innerHTML += `
                        <div class="flex items-center gap-3 bg-slate-900/60 p-2.5 rounded-xl border border-slate-800/50">
                            <div class="w-2.5 h-2.5 rounded-full" style="background-color: ${r.color}"></div>
                            <span class="text-sm font-semibold text-slate-200 tracking-wide">${name}</span>
                        </div>`;
                });
            }

            // Tampilkan Modal dengan Transisi Mulus
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.firstElementChild.classList.remove('scale-95');
                modal.firstElementChild.classList.add('scale-100');
            }, 10);
        };

        window.closePatrolModal = function() {
            const modal = document.getElementById('patrolModal');
            modal.classList.add('opacity-0');
            modal.firstElementChild.classList.replace('scale-100', 'scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        };

        // Klik di luar area modal untuk menutup modal
        document.getElementById('patrolModal').addEventListener('click', function(e) {
            if (e.target === this) closePatrolModal();
        });

        async function downloadImage() {
            const el = document.getElementById('captureArea');
            const controls = document.getElementById('controls');
            
            // 1. Sembunyikan kontrol navigasi
            controls.style.visibility = 'hidden';

            // 2. Re-render tanpa highlight tanggal aktif sekarang agar hasil cetak JPEG bersih & seragam
            render(true);

            const isLightTheme = document.body.classList.contains('light-theme');
            const captureBgColor = isLightTheme ? '#ffffff' : '#070c1a';
            
            // 3. Ambil tangkapan layar menggunakan html2canvas
            const canvas = await html2canvas(el, { 
                scale: 2, 
                backgroundColor: captureBgColor, 
                width: 800 
            });
            
            // 4. Setelah tangkapan layar selesai diambil, kembalikan highlight di web ke semula
            render(false);
            controls.style.visibility = 'visible';

            canvas.toBlob(blob => {
                const a = document.createElement('a'); 
                a.href = URL.createObjectURL(blob); 
                a.download = `Jadwal_Ronda_${date.toLocaleString('id-ID', {month:'long', year:'numeric'}).replace(' ', '_')}.jpg`; 
                a.click();
            }, 'image/jpeg', 1.0);
        }
        
        function changeMonth(m) { 
            date.setMonth(date.getMonth() + m); 
            render(); 
        }
        
        // Memulai inisialisasi pertama saat aplikasi dibuka
        render();
    </script>
</body>
</html>
